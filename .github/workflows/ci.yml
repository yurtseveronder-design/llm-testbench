name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: Example run (one case is expected to fail: the toy target is hijackable on purpose)
        run: PYTHONPATH=src:. python -m llm_testbench.cli run examples/cases.jsonl --target python:examples.toy:answer --repeats 2 --allow-failures --out result.json
